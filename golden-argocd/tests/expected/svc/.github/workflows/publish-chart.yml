name: Publish chart

on:
  pull_request:
    paths: [helm/**]
  push:
    branches: [main]
    paths: [helm/**]

jobs:
  chart:
    # No chart list. The workflow walks helm/*/Chart.yaml and publishes each
    # one to the ECR repository named by its own Chart.yaml.
    uses: Fomiller/gh-actions/.github/workflows/helm-ecr.yaml@main
    permissions:
      id-token: write
      contents: read
    with:
      role-to-assume: arn:aws:iam::000000000000:role/github-actions
      aws-region: us-east-1
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
