name: Generate

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - repo.nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    uses: Fomiller/gh-actions/.github/workflows/nix-generate.yaml@main
    permissions:
      contents: write
    with:
      commit-back: ${{ github.actor == 'renovate[bot]' }}
    secrets: inherit
