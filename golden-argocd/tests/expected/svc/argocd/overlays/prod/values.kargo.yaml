# Written once, then it is yours. `nix run .#generate` never touches it again.
#
# The prod promotion pipeline, rendered by kargo-project-chart. See that chart's
# README for every field; what is here is the smallest pipeline that works.

project:
  name: svc-go
  # Promotions commit back into this repo. The chart version and the image tag
  # both live in argocd/overlays/, so a promotion touches only files a reader
  # of this repo can find.
  repoURL: https://github.com/Fomiller/svc-go.git

services:
  - name: svc-go
    image:
      repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/svc-go

charts:
  - name: svc-go-chart
    chart:
      repoURL: oci://695434033664.dkr.ecr.us-east-1.amazonaws.com/svc-go-chart

warehouses:
  - name: svc-go
    interval: 5m0s
    # One warehouse subscribing to both, so a promotion carries a matched pair
    # rather than letting the image and the chart drift a release apart.
    services: [svc-go]
    charts: [svc-go-chart]
    # Two origins from one definition: `svc-go` takes the stable releases a
    # merge to main cuts, `svc-go-rc` takes the candidates a manual run
    # cuts off a branch. The stage below reads the primary one, so a candidate
    # is tracked and visible without deploying anywhere until a stage asks for
    # it by name.
    #
    # Mutually exclusive with allowTagsRegex — the channels carry the patterns.
    channels: [release, rc]
    updatePaths:
      - path: argocd/overlays/prod/values.app.yaml
        rootRelative: true
        updates:
          - { key: image.tag, source: svc-go }
      - path: argocd/overlays/prod/kustomization.yaml
        rootRelative: true
        updates:
          - { key: helmCharts.0.version, source: svc-go-chart }

stages:
  - name: prod
    color: green
    autoPromotion: true
    warehouses: [svc-go]
    env: prod
    git:
      repoURL: https://github.com/Fomiller/svc-go.git
      branch: main
