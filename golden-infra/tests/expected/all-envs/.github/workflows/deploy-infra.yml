name: Terragrunt Deploy - Infra

on:
  pull_request:
    paths:
      - .github/workflows/deploy-infra.yml
      - infra/**
      - justfile
      - just/terraform.just
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-infra.yml
      - infra/**
      - justfile
      - just/terraform.just

jobs:
  plan-dev:
    name: Plan Infra (dev)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      id-token: write
      contents: read
    uses: Fomiller/gh-actions/.github/workflows/terragrunt.yaml@main
    with:
      environment: dev
      infra-dir: infra/live/dev
      doppler-project: infra-all
      aws-default-region: us-east-1
      tg-plan: true
      use-oidc: true
    secrets: inherit

  apply-dev:
