name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: Fomiller/gh-actions/.github/workflows/nix-flake-check.yaml@main
    with:
      flake-dirs: '["golden-base","golden-github","golden-service","golden-infra","golden-argocd","golden-docs","renovate","docs"]'

  # The flake check builds the book too, but only under nix. This catches a
  # page that builds locally and breaks with the mdbook the deploy uses.
  docs-build:
    uses: Fomiller/gh-actions/.github/workflows/mdbook.yaml@main
    # Nothing is published with deploy: false, but the called job still
    # declares these, and a caller cannot grant less than the callee asks for.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      book-path: docs
      deploy: false
